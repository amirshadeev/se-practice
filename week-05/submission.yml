# week-05/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "05"

student:
  name: Amir Shadeyev
  student_id: 24B030322          # as in KBTU records, e.g. 00X000000
  github: amirshadeev             # your GitHub username, the one that owns the repo

assistant:
  tool:  Gemini              # e.g. ChatGPT, Claude, Gemini, DeepSeek, Grok
  model: Gemini 3.6 Flash        # the exact model name with its version. "ChatGPT" is not a model name.

language:
  name:  python              # python | javascript | typescript | java | csharp | go | cpp | <other>
  path:   A             # A (Python, the shipped checker runs your code) | B (any other language)

counts:
  tests:  19             # how many tests your suite runs — Path A: the N in "Ran N tests"
  v1_changed:  no        # yes | no   is your final booking file different from code/original/booking_v1 ?
  change_log_rows: 2     # rows in lab-report.md section 7 (always at least 1)

checker:
  # Numbers from YOUR last run of: python tests/check_booking.py
  # They must add up to the number of checks it runs (32 on Path A, 13 on Path B).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 30
  fail: 2
  error: 0
  commit:  8684cda            # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: [M2, M10]      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [M9, L9]

assumptions:
  # The contract says times are integers and stops there. Decide, declare, and defend it in lab-report.md §9.2.
  # Any answer is acceptable. Not deciding is not.
  non_integer_time: not-handled    # what YOUR can_book does for start=600.5 or start="600"

carried:
  # What you declared in week-04/submission.yml under overlap_touching_bookings.
  # AC4 settles it this week: touching endpoints are allowed. If you said not-allowed, that is a
  # finding for lab-report.md §1 — not a penalty.
  week04_touching: allowed     # allowed | not-allowed | not-submitted

review_findings:
  # Three or more. One line each, and each one names what it is about: an AC, a check ID,
  # one of your tests, or v1.
  # Worthless:        "the AI made some mistakes"
  # Worth everything: "F7: v1 used start <= b, so can_book(570, 600, ...) was rejected although AC4 allows touching"
  - M2: the AC1 lower bound start >= 0 is redundant when now >= 0 and start > now
  - M10: the AC5 mutation is not caught by the contract-valid test suite
  - test_input_existing_is_unchanged: verifies that existing bookings are not modified
  - v1: the assistant's first version is preserved unchanged

honesty:
  v1_unedited:  yes                     # yes | no   code/original/ holds the assistant's first answer, untouched
  can_explain_overlap_without_ai: yes   # yes | no   you will be asked in class
  ai_usage_disclosed:    yes          # yes | no   AI_USAGE.md is complete
